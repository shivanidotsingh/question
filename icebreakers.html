<title>icebreaker</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Helvetica, Arial, sans-serif;
    transition: background-color 0.5s, color 0.5s;
  }
  .container {
    max-width: 900px;
    margin: 10vh auto;
    padding: 0 20px;
    text-align: left;
  }
  h1 {
    font-size: clamp(3rem, 7vw, 5rem);
  }
  p {
    font-size: 1.5rem;
    line-height: 1.4;
  }
  .meta {
    font-size: 1rem;
    opacity: 0.7;
    margin-top: -20px;
  }
  button {
    background: none;
    border: none;
    font-size: 1.5rem;
    font-weight: bold;
    color: inherit;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-top: 50px;
    margin-right: 30px;
    transition: color 0.3s;
    text-align: left;
  }
  button:hover {
    opacity: 0.7;
  }
  .toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 1.5rem;
    margin: 0;
    text-decoration: none;
    z-index: 100;
  }
  .grid-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    color: black;
    overflow-y: auto;
    padding: 60px 20px 20px;
    box-sizing: border-box;
    display: none;
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .word-card {
    padding: 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .word-card:hover {
    transform: scale(1.02);
  }
  .card-word {
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .card-definition {
    font-size: 0.85rem;
    opacity: 0.75;
  }
  .source-link {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 0.9rem;
    opacity: 0.6;
    color: inherit;
    text-decoration: underline;
    z-index: 100;
  }
  .source-link:hover {
    opacity: 1;
  }
  .grid-label {
    max-width: 1400px;
    margin: 0 auto 20px;

  }
</style>

<div class="container" id="mainView">
  <h1 id="question">loading...</h1>

<script>
const icebreakers = [
  { q: "What's the best conversation you ever had with a stranger?", date: "May 5, 2026", contributor: "Rubi", context: "From her Chit Chat Challenge wrap-up. She noted that collecting stranger encounter anecdotes was a highlight, and discovered that talking about people's best stranger conversations is itself a great icebreaker." },
  { q: "What's the nicest thing a stranger has done for you?", date: "March 3, 2026", contributor: "The Guardian", context: "This question is the basis of a Guardian series on 'the kindness of strangers.'" },
  { q: "What three words would your friends use to describe you?", date: "February 17, 2026", contributor: "Melvin Adekanye", context: "From a bona-fide icebreaker expert and founder of JamSocial, a platform for starting conversations at events. You can also ask what three words they wish their friends would use, or what they fear." },
  { q: "What was the worst car you ever owned?", date: "January 5, 2026", contributor: "Neil", context: "A friend's story about trading in an ant-infested vehicle inspired this one. Gets people talking about their car disasters and mishaps." },
  { q: "What is a 'rich person thing' you would be totally into if you became rich?", date: "November 18, 2025", contributor: "Rico Blancaflor", context: "Great for understanding what people secretly covet and what luxury means to them personally." },
  { q: "If you had to describe yourself in five phrases, what would they be?", date: "November 3, 2025", contributor: "The Noticers", context: "Inspired by recent posts about Artists of Noticing. Examples: 'Dog Mama, Wannabe Tom Lehrer, Regretful Nomad, Reluctant Spinster, Luddite.'" },
  { q: "What's the coolest animal you've ever seen on a walk?", date: "September 23, 2025", contributor: "Kate Kenfield", context: "An Aussie-inspired icebreaker. Kate noted that Australian possums are quite different from the U.S. variety. Great for travel groups or nature-focused conversations." },
  { q: "If you could be a type of footwear, what would you be and why?", date: "August 12, 2025", contributor: "Sarah Farley", context: "A playful icebreaker from Sarah's walking and writing workshops. Encourages creative and whimsical thinking." },
  { q: "If you left home and forgot one thing, would you rather have forgotten your cell phone or wallet?", date: "July 29, 2025", contributor: "Sergeant First Class Marc D. Simon", context: "A thoughtful question about priorities and what we value most in our daily lives." },
  { q: "If you died but could be summoned back with a specific sound, what sound would it be?", date: "July 1, 2025", contributor: "Cayla Vidmar", context: "Cayla's favorite answer: 'the shake-shake of loose McDonald's fries in the bottom of the bag.' Wonderfully weird and creative." },
  { q: "If you could only speak by using quotes/script from one movie, which movie would you choose?", date: "June 17, 2025", contributor: "Jennifer Chan-Huang", context: "Great for office groups. Creates water cooler talk with people quoting their favorites with varying degrees of convincing voice acting." },
  { q: "What piece of media do you wish you could experience for the first time again?", date: "May 6, 2025", contributor: "Tomas", context: "Could be a book, movie, song, painting, or poem. Explores what moves people and why." },
  { q: "What was the best thing you ever bought at a yard or estate sale that cost under $5?", date: "April 22, 2025", contributor: "Judi Kauffman", context: "Judi uses this with her neighborhood coffee hour group. Gets people sharing treasures and bargain finds." },
  { q: "What music did you discover from your parents, or their record collection?", date: "April 8, 2025", contributor: "Rob Walker", context: "Inspired by an NPR All Songs Considered segment. Great for exploring shared family touchstones." },
  { q: "What was the last costume you wore?", date: "April 8, 2025", contributor: "Various", context: "A fun question from a WSJ article on oddball conversation starters. Always generates entertaining stories." },
  { q: "If you were on Jeopardy, what category is your strength and would you love to get? Which category would you NOT like to see?", date: "February 25, 2025", contributor: "Helen D.", context: "Great for understanding people's knowledge, interests, and insecurities." },
  { q: "If you could know the answer to one conspiracy theory — whether it was true or not — which would it be?", date: "December 18, 2024", contributor: "Ash K.", context: "Ash would want to know about Area 51. Gets people thinking about what mysteries captivate them." },
  { q: "If you could live inside the world of any piece of art for a day, which would you choose?", date: "November 4, 2024", contributor: "Abra McAndrew", context: "Wonderful for art museum groups and people with strong aesthetic sensibilities." },
  { q: "How did you spend time regrettably last week, and if you could retroactively get that time back, how would you spend it?", date: "October 8, 2024", contributor: "Jake C.", context: "Invites gentle reflection on time management and priorities." },
  { q: "What can you speak about, with no advance preparation, for 30 minutes?", date: "September 10, 2024", contributor: "Rubi McGrory", context: "Rubi once discovered someone was 'The Goddess of Guinea Worms' using this question. Many people answer 'their dogs.' Teachers may have an unfair advantage." },
  { q: "If a sixteenth-century painter was at your service today, what would be your still-life painting defining your life at the moment?", date: "July 30, 2024", contributor: "Susana Robles", context: "A beautifully poetic question from a reader in Spain. Invites reflection through art historical imagination." },
  { q: "Build your dream strip mall with five chain establishments — the strip mall of your heart.", date: "May 21, 2024", contributor: "Julia Beck", context: "From an Atlantic article on suburbs. People often pick Target, Barnes and Noble, cafes, gyms, and theaters. Don't have to live there, just spend time there." },
  { q: "If you had a personal chef coming over to make you dinner (and money is not an issue) what would you ask them to prepare for you?", date: "April 26, 2024", contributor: "Mary Austin", context: "A culinary conversation starter that explores what comfort food truly means to someone." },
  { q: "If you were able to chat with an animal for 5 minutes: which one would it be, and what would you tell or ask?", date: "March 26, 2024", contributor: "Balázs Rákóczi", context: "You can make it harder by excluding your own pets. Great for animal lovers and philosophers alike." },
  { q: "What phone numbers can you recite from memory?", date: "February 28, 2024", contributor: "Sarah Orman", context: "Especially interesting across different age groups. Sarah's brother still remembered their favorite pizza place number from a 90s radio jingle." },
  { q: "When have you felt touched by something larger than yourself?", date: "December 4, 2023", contributor: "Andrea Trancoso", context: "A profound question touching on spirituality, community, and belonging." },
  { q: "You're the organizer of a music festival; pick any two music headliners, living or dead.", date: "November 7, 2023", contributor: "M.W.", context: "From a trainer in restorative practices. Great for warm-ups or closings in community circles." },
  { q: "What's something you believe in but can't prove?", date: "August 30, 2023", contributor: "Bella M.", context: "A risky but rewarding question that gets to people's values and faith." },
  { q: "What animal would you ride into battle?", date: "July 18, 2023", contributor: "Preston A.", context: "Could be real or imagined. Very fun and creative. Preston suggests no dragons — too obvious." },
  { q: "If you were a postcard, what would it depict?", date: "April 10, 2023", contributor: "Leonardo Zangrando", context: "A visual, metaphorical question that gets at how people see themselves." },
  { q: "What is a smell that brings back a very strong memory for you?", date: "February 28, 2023", contributor: "Amy Herr", context: "Amy says this icebreaker is always successful. People love sharing sensory memories." },
  { q: "If the story of your life is 300 pages long — what's on page 283?", date: "February 13, 2023", contributor: "Brendan Hall", context: "Page 283 is 'toward the end but not over.' Removes assumptions about how a life story should be told. Originally from a Rolling Stone article on college applications." },
  { q: "If you were a potato, how would you be prepared?", date: "January 18, 2023", contributor: "Karlie B.", context: "No elaboration needed. A delightfully absurd question with surprisingly meaningful answers." },
  { q: "If you were a beverage, what would you be?", date: "November 14, 2022", contributor: "Claire Mason", context: "Doesn't have to be something you enjoy drinking. What beverage embodies you? Claire evolved from 'French Earl Grey tea with milk.'" },
  { q: "Describe your first car, and what it meant for you.", date: "October 17, 2022", contributor: "Estelle Metayer", context: "First cars are special objects. People always have stories — sometimes funny, sometimes poignant." },
  { q: "Using only food: Where did you grow up?", date: "August 8, 2022", contributor: "Alex Hidalgo", context: "Describe your childhood place through food. Creates vivid sensory descriptions of home." },
  { q: "As a child, what was your third space – the space you felt you belonged, that wasn't home or school?", date: "June 27, 2022", contributor: "Elise Granata", context: "Also ask: What about as a teen? A young adult? Elise's was the Hot Topic section of the mall and a local pet store." },
  { q: "If you were a vending machine, what would you dispense?", date: "May 16, 2022", contributor: "Various", context: "Used by a nonprofit in their training process. Gets at what people think they have to offer." },
  { q: "If you could rule for a day, what would your first decree be?", date: "April 18, 2022", contributor: "Sofía", context: "Also fun variations: 'Who would win in a fight, Batman or Terminator?' and 'What's your favorite cleaning product?'" },
  { q: "Tell me about a career milestone you achieved (or heard about) that is weird/unusual/you would never have thought of until it happened.", date: "February 21, 2022", contributor: "Various", context: "Doesn't need to be Nobel Prize level. Just a marker of success, however you define it. From a story about protest stickers being preserved for history." },
  { q: "What's the worst advice you've ever been given?", date: "January 24, 2022", contributor: "Jackie Bayer", context: "A fun one that requires no further explanation. Gets people laughing about bad guidance." },
  { q: "What object, person, animal or situation is happiness? Grief? Hope? Fear?", date: "January 10, 2022", contributor: "Katherine", context: "A metaphor-based question from an English teacher and writer. Inspired by Emily Dickinson's 'the thing with feathers.' From interro.co.uk." },
  { q: "What dream have you never forgotten and why do you think this remains a conscious memory?", date: "December 13, 2021", contributor: "Daniel Seymour", context: "For those who find dreams fascinating. Reveals what our subconscious deems memorable." },
  { q: "What olympic event would you do, if you could do any, no previous experience or talent required?", date: "November 22, 2021", contributor: "Rob Kilner", context: "Rob's dentist asked him this mid-checkup. The dental assistant wanted to jump straight into the 100m Men's Final." },
  { q: "What is your most memorable experience involving an animal?", date: "November 8, 2021", contributor: "Lee Coursey", context: "Lee shared a story about mountain goats forcing him off a trail in Glacier National Park — a reminder that humans are interlopers in wild spaces." },
  { q: "If you had to be turned into a vinyl record, what album or songs would you want to be on it?", date: "October 18, 2021", contributor: "Elias Johnson-Youngquist", context: "Based on the fact that you can cremate someone and press their ashes into vinyl. A morbid but meaningful icebreaker that opens conversation about death and importance." },
  { q: "Tell me about a person that you met only once, and who is not related to you, that really made an impact on you.", date: "October 4, 2021", contributor: "David Krug", context: "A beautiful question about those chance encounters that stick with us." },
  { q: "When were you sure a bad outcome would be your ruin, but in fact it turned out to your benefit?", date: "September 20, 2021", contributor: "Dan C.", context: "Related to noticing opportunities in disaster. Coppola would lean into bad weather and call it 'the cheapest special effects you'll ever have.'" },
  { q: "What is a food you've tried lately that you really liked?", date: "September 6, 2021", contributor: "Betsy", context: "A librarian from West Texas floated this to her quiet grocery store cashier. It opened up a conversation about seaweed chips and built rapport." },
  { q: "If you could erase from your brain one piece of knowledge (memory, or fact/set of facts) what would it be?", date: "August 23, 2021", contributor: "Ellen Susan", context: "Rob's wife asks: what would you want to unknow?" },
  { q: "If you could travel anywhere tomorrow, where would you go?", date: "August 2, 2021", contributor: "Various", context: "A classic. Timely as travel becomes possible again." },
  { q: "If you could be part of any world record, what would it be?", date: "July 12, 2021", contributor: "Mallory Gilmore", context: "Do you want a solo risky record, a goofy one, a big group one, or a serious one? Reveals personality and values." },
  { q: "Tell a lie and a true thing about yourself. Let others guess which is which.", date: "June 28, 2021", contributor: "Judi Kauffman", context: "Judi taught design and art for years. She told students one could be a dream instead. Judi claimed she was a swimmer (the lie) and a hair model (true)." },
  { q: "If you were alive in [time period X], what do you think your line of work would have been?", date: "June 16, 2021", contributor: "Keith Hester", context: "Change the period based on the group. Keith used the 1870s/Wild West. You might want to specify ignoring gender/racial restrictions of the time." },
  { q: "Do you believe in destiny, or in the power of free will?", date: "June 2, 2021", contributor: "Scott Boms", context: "From the book 'Being Hear.' A deep question from Scott's collection of 'questions to get to know someone.'" },
  { q: "What is your most trivial, useless, or flat-out counter-productive superpower?", date: "May 17, 2021", contributor: "Tyler Cowen", context: "Extremely talented people are almost always extraordinarily good at one or more entirely trivial tasks. Example: pouring nearly identical amounts of liquid without thought." },
  { q: "If you were a boat, what kind of boat would you be? And why?", date: "May 3, 2021", contributor: "Caleb Wright", context: "A manager asked Caleb this. He wanted to be a speedboat; his manager wanted to be a pontoon — the hangout spot for friends." },
  { q: "What's your favorite-ever celebrity sighting? Have you ever been truly star-struck?", date: "April 19, 2021", contributor: "Rob Walker", context: "Inspired by a memoir from Chris Frantz of Talking Heads, who bumped into Patti Smith on a beach in the Bahamas." },
  { q: "What is your most vivid memory of a historical event that occurred during your childhood?", date: "April 5, 2021", contributor: "Doug Fawcett", context: "The Kennedy assassination is the standard example. But everyone has one — a moment when history became personal." },
  { q: "How does your family / your culture cook rice?", date: "March 22, 2021", contributor: "Dr. Amber Spry", context: "From her identity politics class. Uses this to show how the same topic means many things to different people." },
  { q: "What was your favorite activity as a 10-year-old?", date: "March 9, 2021", contributor: "Tammy Hunter", context: "Tammy has always had great responses when she's led meetings with this." },
  { q: "What activities, realizations, or new ways of doing things will you (try to) keep from this past year?", date: "February 22, 2021", contributor: "Jenna Sherry", context: "A reflection on what we've learned about ourselves during challenging times." },
  { q: "What is the dumbest thing you made your parents buy for you as a kid?", date: "February 8, 2021", contributor: "Vedika", context: "Vedika sent ten icebreakers. This is one of them." },
  { q: "What topic do you wish was a college major but isn't?", date: "February 8, 2021", contributor: "Vedika", context: "A second one from Vedika. Gets at deep interests and passion areas." },
  { q: "Have you ever had an Internet friend? Who is the best Internet friend you've ever made?", date: "February 8, 2021", contributor: "Vedika", context: "A third from Vedika. Could be someone you later met IRL, or an internet-only friend." },
  { q: "What is your earliest childhood memory? If mundane, why did it stick? If unusual, what's most vivid about it?", date: "January 25, 2021", contributor: "Jessica", context: "From an 8.5-hour reunion hangout. Jessica liked these add-on questions because they peek into people from before you met." },
  { q: "What is your favorite compliment of all the compliments you've ever received?", date: "January 11, 2021", contributor: "Karla Strambini", context: "Karla collects compliments as an antidote to hoarding insults. She's turning them into labels to stitch into clothes." },
  { q: "What are you looking forward to right now?", date: "December 28, 2020", contributor: "Mikah", context: "Centers conversation on hope. Push beyond the obvious — seek specifics about what they most look forward to." },
  { q: "What would you write on a gigantic billboard?", date: "December 16, 2020", contributor: "Prado", context: "Someone once said they'd want all the billboards between two towns. Opens ideas about legacy and messaging." },
  { q: "What random stranger from your life do you think about or talk about regularly?", date: "November 30, 2020", contributor: "Clare Robinson", context: "Clare's is a guy in Tokyo who did the most dramatic, overblown sneeze. We are all someone else's random stranger." },
  { q: "What famous masterpiece painting or sculpture would you like to own?", date: "November 16, 2020", contributor: "Candice Serafino", context: "From a university career advisor. Pairs well with questions about historical events and famous figures." },
  { q: "If you went into the witness protection plan what identity would you like to assume?", date: "November 2, 2020", contributor: "Diane Burns", context: "Diane's best site is her local coffee shop; her favorite social media is a cup of coffee and conversation." },
  { q: "What is a boring fact about yourself?", date: "October 21, 2020", contributor: "Alexandra Carter", context: "From a teacher friend, used to mitigate privilege in 'interesting fact' questions. 'My favorite sandwich is club' creates equalizing connection." },
  { q: "If you had to survive as a fruit, what would it be?", date: "October 7, 2020", contributor: "Andi Foster", context: "You're just surviving, can't move. Andi now wants to be a banana 'because then I would be with friends.'" },
  { q: "What song would you like to be played at your funeral?", date: "September 21, 2020", contributor: "Ben Greenman", context: "A dark but meaningful question about what we want to be remembered by." },
  { q: "Which book did you read in college or high school that was actually interesting enough that you still think or talk about it sometimes?", date: "September 7, 2020", contributor: "Wm Henry Morris", context: "Also leads to talk about favorite teachers, assigned reading, and what makes books memorable." },
  { q: "If you had one opportunity to permanently change someone's life (better or worse) who would it be and how would you change it?", date: "August 24, 2020", contributor: "Anonymous", context: "A thought-provoking moral question. Morris suggests excluding politicians." },
  { q: "Without using the title of your job, tell me what you do.", date: "August 10, 2020", contributor: "Yael", context: "Many responses are very fun. Forces creativity in self-description." },
  { q: "What's something you would not tell someone about yourself on a first date?", date: "July 25, 2020", contributor: "Dan Ariely", context: "From research on deepening connections. People crave connection but small talk feels safer." },
  { q: "If you could rename yourself, what new name would you choose, and why?", date: "July 13, 2020", contributor: "Sandeep Chakraborty", context: "Rob's wondered if a more unusual name would be better branding for a writer." },
  { q: "What's the most expensive habit you've started as an adult that you now wish you could break?", date: "June 29, 2020", contributor: "Bethany Crystal", context: "The more you know, the better quality you grow to expect. Bethany has expensive tastes in candles." },
  { q: "If you could sing like any famous singer in the world (living or dead), who would it be?", date: "June 15, 2020", contributor: "Tony Brent", context: "A classic. Hard to choose. Which Beatle would you pick?" },
  { q: "Describe something that's made you smile today.", date: "June 2, 2020", contributor: "Bristol City Council", context: "Simple, direct, effective. Gets at the personal story behind each response." },
  { q: "What was the first R-rated movie you saw? How old were you?", date: "May 18, 2020", contributor: "Stephen Chisa", context: "Sparks discussion about the movie, parenting philosophy, and rating systems. Stephen saw Starship Troopers at 7 in a motel." },
  { q: "What was your first concert? How did you get there?", date: "May 18, 2020", contributor: "Stephen Chisa", context: "Often asked at Sofar concerts. Sparks nostalgia, parent memories, and maybe devious transportation stories." },
  { q: "What is your favorite body of water? Why?", date: "May 18, 2020", contributor: "Stephen Chisa", context: "History, childhood nostalgia, or lake monsters — reasons vary wonderfully." },
  { q: "If you had to make your own zombie movie, what would your zombies be like?", date: "May 4, 2020", contributor: "Ryan Kushner", context: "A 'zombie icebreaker.' Gets people excited to share creativity. Ryan's zombies get full after a big meal." },
  { q: "What's something new you've learned about yourself in the last three months?", date: "April 20, 2020", contributor: "Ingrid Fetell Lee", context: "A gentle way to zoom out from the moment and reflect. From her 'Joyful Conversation Starters Guide.'" },
  { q: "Have you been pleasantly surprised by anything recently?", date: "April 13, 2020", contributor: "Daniel S Dunnam", context: "A good time to ask this question, even of yourself." },
  { q: "Have you had any unanticipated quarantine-specific cravings for comfort foods? Have you rediscovered any old passions?", date: "April 7, 2020", contributor: "Casual friend", context: "Inspired by the quarantine era but applicable to any period of change." },
  { q: "What's one word you would use to describe yourself as a teenager?", date: "March 23, 2020", contributor: "Mary Aviles", context: "Rob's answer: 'jackass.' Gets at who we were and how we've changed." },
  { q: "If you had to describe how you're feeling right now as a weather pattern, what's your forecast?", date: "March 9, 2020", contributor: "Amy Varga", context: "Also: 'If you had to describe how you're feeling as an amusement park ride, what ride are you on?' Metaphor invites deeper reflection." },
  { q: "What's the worst prediction you ever made?", date: "February 24, 2020", contributor: "Rob Walker", context: "Rob predicted Titanic would be a flop and that Leonardo DiCaprio would never be a star. He came in dead last in an Oscar pool." },
  { q: "What material are you most like? (E.g., plastic, porcelain, dirt, silk, stone etc.)", date: "February 10, 2020", contributor: "Amy Santee", context: "Forces focus on 1-2 major qualities. Complex but fun. Rob's considering his answers." },
  { q: "If you did not have to sleep, how would you spend the extra 8 hours?", date: "January 27, 2020", contributor: "Various", context: "A thought-provoking question about what we truly want to do with time." },
  { q: "If you weren't doing your current job, what would your dream job be?", date: "December 27, 2019", contributor: "Becky Terry", context: "Becky uses this at networking events. One guy proved he could be a concert pianist. Rob would be a radio DJ." },
  { q: "What thing from nature are you? (Excluding animals.)", date: "December 8, 2019", contributor: "Lassie", context: "Responses: stone at river bottom, smoldering ember, geyser, vine, moss. Lassie says 'dirt' because it takes on different qualities and grows plants." },
  { q: "What would you do if I gave you a billion dollars?", date: "November 14, 2019", contributor: "Spotify exec", context: "From the Startup podcast's Gimlet acquisition story. Tests ambitions. Good answers are rare." },
  { q: "If you could do something that you don't do because it's bad for you, but you could do it without any repercussions — what would you do?", date: "October 31, 2019", contributor: "Matt Klam", context: "A thought experiment that reveals values and boundaries." },
  { q: "Have you ever quit doing something that you used to be really passionate about? Do you regret it? Will you ever take it up again?", date: "October 22, 2019", contributor: "Scene By Scene podcast", context: "From Josh and Dean's discussion of American Splendor. Multiple related angles in one question." },
  { q: "Imagine you could devote a year to researching someone's biography. Who would your subject be?", date: "September 29, 2019", contributor: "Anonymous", context: "Rob would pick P.T. Barnum. Opens people up about who fascinates them." },
  { q: "If you had to take a bath in a food, which food would it be?", date: "September 12, 2019", contributor: "Jeremy Anderberg", context: "Jeremy's favorite icebreaker. Range from chocolate to cheese to mashed potatoes and gravy. Considers texture, liquid, comfort." },
  { q: "What question do you wish people would ask you?", date: "August 27, 2019", contributor: "Michael Shiloh", context: "Reveals what people want others to know about them." },
  { q: "Of the places you have lived or spent significant time, which one had the most pleasing view out your main window/door?", date: "August 12, 2019", contributor: "Jason", context: "Introspective and evocative. Makes you appreciate the view you have now." },

  { q: "Imagine you are backpacking through a remote jungle. During the night with a native tribe, they serve you human flesh. Would you eat it?", date: "June 20, 2019", contributor: "Whitney Teubner", context: "A provocative thought experiment. The 'guest of honor' framing gives an out. Gets at boundaries and conditions." },
  { q: "If you could live in the setting of any book or movie, without necessarily being involved in the story, which would you choose?", date: "June 13, 2019", contributor: "Noel Franus", context: "Lots of Lord of the Rings answers. Rob would choose Stranger Than Paradise or something with Almodóvar's colors." },

const colors = [
  { bg: "#FFF8F3", text: "#5F4A42" },
  { bg: "#F0F7F4", text: "#3D5A51" },
  { bg: "#FFF6E6", text: "#6B5B3F" },
  { bg: "#F3F1FF", text: "#4A3F7F" },
  { bg: "#FFF5F5", text: "#7A4A5A" },
  { bg: "#F5FAFF", text: "#3D5A80" },
  { bg: "#FFFAF0", text: "#5F5A3F" },
  { bg: "#F6F5F0", text: "#4A4A42" }
];

let gridOpen = false;

function showRandom() {
  const idx = Math.floor(Math.random() * icebreakers.length);
  const color = colors[Math.floor(Math.random() * colors.length)];
  const item = icebreakers[idx];

  document.body.style.backgroundColor = color.bg;
  document.body.style.color = color.text;
  document.getElementById("question").textContent = item.q;
  document.getElementById("meta").textContent = item.date + " — " + item.contributor;
  document.getElementById("context").textContent = item.context;
  window.currentQuestion = item.q;
}

function toggleGrid() {
  gridOpen = !gridOpen;
  document.getElementById("gridView").style.display = gridOpen ? "block" : "none";
  document.getElementById("mainView").style.display = gridOpen ? "none" : "block";
  document.getElementById("toggleBtn").textContent = gridOpen ? "×" : "#";
  document.querySelector(".source-link").style.color = gridOpen ? "black" : "inherit";
  if (gridOpen) buildGrid();
}

function buildGrid() {
  const grid = document.getElementById("wordGrid");
  grid.innerHTML = "";
  icebreakers.forEach((item, i) => {
    const color = colors[i % colors.length];
    const card = document.createElement("div");
    card.className = "word-card";
    card.style.backgroundColor = color.bg;
    card.style.color = color.text;
    card.innerHTML = '<div class="card-word">' + item.q + '</div><div class="card-definition">' + item.date + ' — ' + item.contributor + '</div>';
    card.onclick = () => {
      document.body.style.backgroundColor = color.bg;
      document.body.style.color = color.text;
      document.getElementById("question").textContent = item.q;
      document.getElementById("meta").textContent = item.date + " — " + item.contributor;
      document.getElementById("context").textContent = item.context;
      window.currentQuestion = item.q;
      toggleGrid();
    };
    grid.appendChild(card);
  });
}

showRandom();
</script>
